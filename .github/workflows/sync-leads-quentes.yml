name: Leads quentes Explee para Trello

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

concurrency:
  group: leads-quentes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sincronizar leads quentes
        env:
          EXPLEE_API_KEY: ${{ secrets.EXPLEE_API_KEY }}
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: "6afc5dda5caa26aa78fbd51a"
          TRELLO_LIST_ID: "6afc5ddd8fb5cc83dd7319a1"
          TRELLO_REPLIED_LIST_ID: "6afc8e14c229a83c3755f7c3"
        run: python sync_hot_leads-2.py
